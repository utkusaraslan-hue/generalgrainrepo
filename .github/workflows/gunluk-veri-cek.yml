name: Günlük borsa verisi çek

on:
  schedule:
    # TRT = UTC+3 (Turkiye DST kullanmiyor)
    - cron: "0 2 * * *"   # 02:00 UTC = TR 05:00
    - cron: "0 13 * * *"  # 13:00 UTC = TR 16:00
    - cron: "0 18 * * *"  # 18:00 UTC = TR 21:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  veri-cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r veri_kaynagi/requirements.txt

      - name: GECICI TESHIS - TMO baglantisi
        continue-on-error: true
        run: |
          echo "== DNS =="
          getent hosts www.tmo.gov.tr || nslookup www.tmo.gov.tr || true
          echo "== curl -v (10s timeout) =="
          curl -v -k -m 10 https://www.tmo.gov.tr/ 2>&1 | head -60 || true
          echo "== curl http (10s timeout) =="
          curl -v -m 10 http://www.tmo.gov.tr/ 2>&1 | head -30 || true
          echo "== runner disardan giden IP =="
          curl -s -m 10 https://api.ipify.org || true
          echo

      - name: Veriyi cek (bosluk-doldurma modu)
        id: veri_cek
        continue-on-error: true
        run: python -m veri_kaynagi.main

      # continue-on-error + always(): bir kaynak (orn. TMO) basarisiz olsa
      # bile basarili olan kaynaklarin verisi kaybolmasin, yine commit'lensin.
      - name: Degisiklikleri commit'le
        if: always()
        run: |
          git config user.name "borsa-veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add veri_kaynagi/borsa_verileri.db veri_kaynagi/arsiv
          git diff --cached --quiet || git commit -m "Gunluk veri: $(date -u +%Y-%m-%d)"
          git push

      - name: Kaynak hatasi varsa job'i basarisiz isaretle
        if: steps.veri_cek.outcome == 'failure'
        run: |
          echo "En az bir kaynak basarisiz oldu, yukaridaki 'Veriyi cek' loglarina bakin." >&2
          exit 1
