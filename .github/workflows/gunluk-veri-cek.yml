name: Günlük borsa verisi çek

on:
  schedule:
    # TRT = UTC+3 (Turkiye DST kullanmiyor) - kullanici istegi: gunde 2 kez, 07:00 ve 21:00 TRT
    - cron: "0 4 * * *"   # 04:00 UTC = TR 07:00
    - cron: "0 18 * * *"  # 18:00 UTC = TR 21:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  veri-cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r veri_kaynagi/requirements.txt

      # TMO, GitHub Actions'in bulut IP araligini (Azure) tamamen engelliyor -
      # dogrulandi (bkz. proje hafizasi), retry ile cozulemez. TMO artik
      # SADECE kullanicinin Mac'inde launchd ile yerel calisiyor
      # (veri_kaynagi/tmo_yerel_calistir.sh). Burada TURIB + Konya + 2026-09
      # itibariyla eklenen 4 yeni kaynak (bandirma/etb/kirklareli/tdag).
      # NOT: yeni 4 kaynak GH Actions IP'lerinden HENUZ test edilmedi, TMO gibi
      # engellenirlerse continue-on-error sayesinde diger kaynaklar etkilenmez
      # ama sessizce veri toplamayi da birakabilirler - ilk birkac calistirmayi
      # (Actions sekmesinden) kontrol et.
      - name: Veriyi cek (bosluk-doldurma modu)
        id: veri_cek
        continue-on-error: true
        run: python -m veri_kaynagi.main --kaynak turib konya bandirma etb etb_aylik kirklareli tdag

      # continue-on-error + always(): bir kaynak (orn. TMO) basarisiz olsa
      # bile basarili olan kaynaklarin verisi kaybolmasin, yine commit'lensin.
      - name: Degisiklikleri commit'le
        if: always()
        run: |
          git config user.name "borsa-veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add veri_kaynagi/borsa_verileri.db veri_kaynagi/arsiv
          git diff --cached --quiet || git commit -m "Gunluk veri: $(date -u +%Y-%m-%d)"
          git push

      - name: Kaynak hatasi varsa job'i basarisiz isaretle
        if: steps.veri_cek.outcome == 'failure'
        run: |
          echo "En az bir kaynak basarisiz oldu, yukaridaki 'Veriyi cek' loglarina bakin." >&2
          exit 1
